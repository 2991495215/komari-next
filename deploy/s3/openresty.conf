server {
    listen 80;
    listen [::]:80;
    server_name k.trent30.com k.zinc.mom k.zinc.run;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k.trent30.com;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/cloudflare-origin/trent30-zinc/origin.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/cloudflare-origin/trent30-zinc/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ ^/assets/(chunk-index-fLuAYRIw|chunk-NodeListContext-p_Hfpvbi|chunk-NodeSelector-CA5Fywb4|chunk-pingTask-BJ21Rypr)\.js$ {
        root /www/komari-overrides;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /_zinc-brand.js {
        root /www/komari-overrides;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        alias /www/komari-overrides/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /registerSW.js {
        alias /www/komari-overrides/registerSW.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /_zinc-logo.png {
        root /www/komari-overrides;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /_zinc-bg.jpg {
        alias /www/komari-overrides/_zinc-bg.jpg;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        if ($request_method = "HEAD") {
            rewrite_by_lua_block { ngx.req.set_method(ngx.HTTP_GET) }
        }
        proxy_pass http://127.0.0.1:25774;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        header_filter_by_lua_block {
            ngx.header.content_length = nil
        }
        body_filter_by_lua_block {
            local content_type = ngx.header["Content-Type"] or ""
            if not content_type:find("text/html", 1, true) then
                return
            end

            local chunk, eof = ngx.arg[1], ngx.arg[2]
            ngx.ctx.buffered = (ngx.ctx.buffered or "") .. (chunk or "")
            if not eof then
                ngx.arg[1] = nil
                return
            end

            local body = ngx.ctx.buffered
            body = body:gsub('<span class="text%-primary%-foreground font%-bold text%-xl">K</span>', '<img src="/_zinc-logo.png?v=20260609d" alt="ZINC VPS" style="width:100%%;height:100%%;object-fit:contain;display:block;border-radius:8px;">')
            body = body:gsub("Komari Monitor", "ZINC VPS")
            body = body:gsub("Komari%-Next", "ZINC VPS")
            body = body:gsub("Professional Server Monitoring Solution", "VPS status overview")
            body = body:gsub("Real%-time server monitoring with modern design and powerful features", "Real-time VPS status and uptime overview")
            body = body:gsub('<div class="flex flex%-col items%-center gap%-3"><h4 class="text%-sm font%-semibold text%-foreground">Powered By</h4>.-</div></div><div class="flex flex%-col items%-center md:items%-end gap%-3"><h4', '<div class="flex flex-col items-center md:items-end gap-3"><h4', 1)
            body = body:gsub('d091221cbc56a1a0%-[%w%-_]+%.js', 'd091221cbc56a1a0-ipmap20260621offtraffic3.js')
            body = body:gsub('src="/_next/static/chunks/d091221cbc56a1a0%-ipmap20260621offtraffic3%.js"', 'src="/_next/static/chunks/d091221cbc56a1a0-ipmap20260621offtraffic3.js?v=fix20260624d"')
            body = body:gsub('1b7f494985887928%.js', '1b7f494985887928-latencyi18n20260610.js')
            body = body:gsub('</body>', '<script src="/_zinc-brand.js?v=20260610b"></script></body>', 1)
            ngx.arg[1] = body
        }
    }
}

